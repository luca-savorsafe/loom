apiVersion: agent-dsl/v1alpha1
kind: Agent
metadata: {id: invalid-binding, name: Invalid, purpose: Test, version: 0.4.0}
identity:
  role: Test agent
  red_lines:
    - {id: no-write, statement: Do not write, enforced_by: [gate.filesystem]}
  can: [test]
  cannot: [write]
runtime: {kind: pi, version: 0.1.0, adapters: {ui: headless, execution: extensions}}
components:
  - id: broken-tool
    kind: tool
    version: 0.1.0
    source: {type: inline}
    effects: []
    spec:
      name: bad_tool
      description: Missing bridge binding
      inputSchema: {type: object}
      outputSchema: {type: object}
assembly:
  groups:
    - {id: main, components: [broken-tool], mode: main}
gate:
  default: deny
  filesystem: {write_allow: [], delete_rule: none, param_check: true}
  bash: {allow_presets: [], deny_presets: []}
  egress: {policy: deny_all}

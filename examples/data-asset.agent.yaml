# v0.5 / v1alpha2 静态契约样例，引用的业务程序与运行时需另行提供。
apiVersion: agent-dsl/v1alpha2
kind: Agent
metadata:
  id: policy-workbench
  name: 制度候选维护
  purpose: 起草并审查制度候选，不修改正式制度
  version: 1.0.0
identity:
  role: 根据证据维护制度候选，正式晋级由人类独立执行
  can:
    - 起草候选
    - 检查依据
  cannot:
    - 修改正式制度
    - 自动晋级
  red_lines:
    - id: protect-policy
      statement: 正式制度只读
      enforced_by:
        - resource:policies
        - gate.filesystem
runtime:
  kind: pi
  version: 0.4.0
  adapters:
    ui: tui
    execution: extensions
components:
  - id: policy-domain
    kind: knowledge
    version: 1.0.0
    source:
      type: inline
    spec:
      domain: policy
    requires:
      - type: resource
        ref: policies
    effects: []
  - id: read-bridge
    kind: bridge
    version: 1.0.0
    source:
      type: inline
    spec:
      name: reader
      runtime: python
      entrypoint: bridges/read.py
      facts_only: true
      actions:
        - read
    requires:
      - type: knowledge
        ref: policy-domain
      - type: resource
        ref: policies
    effects:
      - filesystem.read
  - id: read-tool
    kind: tool
    version: 1.0.0
    source:
      type: inline
    spec:
      name: policy_read
      description: 读取制度事实
      inputSchema:
        type: object
      outputSchema:
        type: string
      binding:
        bridge: read-bridge
        action: read
    requires:
      - type: bridge
        ref: read-bridge
        action: read
    effects: []
  - id: write-bridge
    kind: bridge
    version: 1.0.0
    source:
      type: inline
    spec:
      name: writer
      runtime: python
      entrypoint: bridges/write.py
      facts_only: true
      actions:
        - write
    requires:
      - type: resource
        ref: candidates
    effects:
      - filesystem.write
      - artifact.write
  - id: write-tool
    kind: tool
    version: 1.0.0
    source:
      type: inline
    spec:
      name: candidate_write
      description: 把已生成正文写入候选文件
      inputSchema:
        type: object
        required:
          - content
        properties:
          content:
            type: string
      outputSchema:
        type: object
        required:
          - path
        properties:
          path:
            type: string
      binding:
        bridge: write-bridge
        action: write
    requires:
      - type: bridge
        ref: write-bridge
        action: write
    effects: []
  - id: author-guide
    kind: skill
    version: 1.0.0
    source:
      type: inline
    spec:
      name: author-guide
      description: 基于事实起草
      guide: 先检索，再起草；候选写入不代表正式发布。
      tools:
        - policy_read
        - candidate_write
    requires:
      - type: tool
        ref: read-tool
      - type: tool
        ref: write-tool
    effects: []
  - id: review-guide
    kind: skill
    version: 1.0.0
    source:
      type: inline
    spec:
      name: review-guide
      description: 核对依据
      guide: 按原始制度核对差异，指出证据不足；不代替人类批准。
      tools:
        - policy_read
    requires:
      - type: tool
        ref: read-tool
    effects: []
  - id: revision-flow
    kind: workflow
    version: 1.0.0
    source:
      type: inline
    spec:
      name: revision
      roles:
        - author
        - reviewer
      initial: draft
      terminal:
        - done
      phases:
        - id: draft
          role: author
          tools:
            - policy_read
            - candidate_write
        - id: review
          role: reviewer
          tools:
            - policy_read
        - id: approve
          role: reviewer
        - id: done
          role: reviewer
      transitions:
        - from: draft
          to: review
          on: tool_succeeded
          tool: candidate_write
        - from: review
          to: approve
          on: phase_completed
        - from: review
          to: draft
          on: manual
        - from: approve
          to: done
          on: approval_granted
      loops:
        - from: review
          to: draft
          on: manual
          max_rounds: 2
      human_checkpoints:
        - phase: approve
          required: true
          prompt: 确认候选稿与检查意见；本批准不授权正式发布
          approval: one_time
    requires:
      - type: tool
        ref: read-tool
      - type: tool
        ref: write-tool
    effects: []
  - id: candidate-report
    kind: output
    version: 1.0.0
    source:
      type: inline
    spec:
      name: candidate-report
      path: workspace/candidates/candidate_policy.md
      media_type: text/markdown
      lifecycle: candidate
      publish: atomic_file
    requires: []
    effects:
      - artifact.write
  - id: result-shape
    kind: review
    version: 1.0.0
    source:
      type: inline
    spec:
      checks:
        - id: result-contract
          kind: schema
          severity: error
    requires: []
    effects: []
  - id: protect-secrets
    kind: gate
    version: 1.0.0
    source:
      type: inline
    spec:
      zero_access:
        - .env
        - secrets/**
    requires: []
    effects: []
assembly:
  groups:
    - id: read-policy
      components:
        - read-tool
        - policy-domain
      mode: main
seats:
  - id: writer
    persona: 负责候选起草，不改正式制度
    components:
      - author-guide
    mode: standard
  - id: checker
    persona: 只读核对制度证据
    groups:
      - read-policy
    mode: read_only
gate:
  default: deny
  filesystem:
    write_allow:
      - workspace/candidates/**
    delete_rule: none
    param_check: true
    zero_access:
      - .env
      - secrets/**
  bash:
    allow_presets:
      - python_tools
    deny_presets:
      - git_push
      - production_write
  egress:
    policy: deny_all
  knowledge_write:
    mode: candidate_only
    paths:
      - workspace/candidates/**
launch:
  binary: pi
  base_flags: []
  entries:
    - name: revise
      task: revise-policy
      coms: false
    - name: explain
      task: explain-policy
      coms: false
resources:
  - id: policies
    kind: knowledge
    access: read_only
    locator:
      path: knowledge/policies
    data_labels:
      - internal
  - id: candidates
    kind: filesystem
    access: read_write
    locator:
      path: workspace/candidates
    data_labels:
      - internal
tasks:
  - id: revise-policy
    objective: 产生有依据、经检查及人审确认的候选稿
    inputSchema:
      type: object
      additionalProperties: false
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
    resultSchema:
      type: object
      additionalProperties: false
      required:
        - answer
        - sources
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            type: string
    interaction:
      mode: interactive
      on_missing_input: ask
    delivery:
      mode: caller
    roles:
      - id: author
        responsibility: 起草候选
        seat: writer
      - id: reviewer
        responsibility: 核对依据并整理审查意见
        seat: checker
    workflow: revision-flow
    outputs:
      - candidate-report
    acceptance:
      - review: result-shape
        target: result
        role: reviewer
  - id: explain-policy
    objective: 只读解释制度
    inputSchema:
      type: object
      additionalProperties: false
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
    resultSchema:
      type: object
      additionalProperties: false
      required:
        - answer
        - sources
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            type: string
    interaction:
      mode: interactive
      on_missing_input: ask
    delivery:
      mode: caller
    seat: checker
knowledge:
  root: knowledge
  lifecycle:
    agent_write: candidate_only
    candidate_prefix: candidate_
    manifest: true
  citations:
    require_source: true
    drift_check: true
